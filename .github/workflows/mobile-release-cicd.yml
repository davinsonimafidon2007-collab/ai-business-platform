# =============================================================================
# MOB-P3-001 — CI/CD automático para release móvil
# =============================================================================
# Jobs:
#   1. debug-apk       — Build APK debug en cada PR a main
#   2. release-aab     — Build AAB release con keystore en tags v*
#   3. firebase-dist   — Distribución a Firebase App Distribution (opcional)
# =============================================================================
name: Mobile Release CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"
  JAVA_VERSION: "17"
  FRONTEND_DIR: frontend

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 — Debug APK (cada PR / push a main)
  # ---------------------------------------------------------------------------
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:run

      - name: Build Next.js export
        run: npm run export
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL || 'http://10.0.2.2:8000' }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ env.FRONTEND_DIR }}/android/app/build/outputs/apk/debug/


  # ---------------------------------------------------------------------------
  # JOB 2 — Release AAB (tags v*)
  # ---------------------------------------------------------------------------
  release-aab:
    name: Release AAB
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js export (production)
        run: npm run export
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.API_URL }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build release AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=app/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.FRONTEND_DIR }}/android/app/build/outputs/bundle/release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.FRONTEND_DIR }}/android/app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # JOB 3 — Firebase App Distribution (opcional, manual trigger)
  # ---------------------------------------------------------------------------
  firebase-dist:
    name: Firebase Distribution
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Build export + Sync
        run: |
          npm run export
          npx cap sync android

      - name: Build release AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=app/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          groups: qa-team
          file: ${{ env.FRONTEND_DIR }}/android/app/build/outputs/bundle/release/app-release.aab

