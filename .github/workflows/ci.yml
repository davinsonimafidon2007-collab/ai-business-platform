# CI.2   — unit + requirements sync + Postgres 16 + integration crítico (INT.1)
# CI.FE.1  — job frontend (Vitest + lint) en paralelo al backend
# CI.LINT.1 — ruff check como gate del job backend
# CI.DOCKER.1 — build de imágenes + smoke del stack completo (compose):
#               containers → migrations → backend → frontend → health checks
#
# Este workflow NO usa ningún secret del repositorio: todos los valores son
# fixtures de CI (JWT de test, Postgres efímero del job). Los workflows que
# sí usan secrets (deploy, mobile-release) fallan explícitamente si faltan.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_business_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_business_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: test
      # ≥32 chars; solo para tests (no es secreto de prod)
      JWT_SECRET_KEY: test_secret_key_that_is_at_least_32_characters_long_ci_only_do_not_use_in_prod
      # Mismo Postgres del service; alembic usa settings.database_url (env DATABASE_URL)
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_business_platform_test
      # Evitar que settings/Firebase intenten I/O real
      FIREBASE_CREDENTIALS_JSON: ""
      FIREBASE_CREDENTIALS_PATH: ""
      SMTP_HOST: ""
      ENABLE_SCHEDULER: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Sync dependencies (incl. dev)
        run: uv sync --locked --group dev

      - name: Check requirements.txt sync (C.1)
        run: uv run --no-sync python scripts/check_requirements_sync.py

      # CI.LINT.1 — antes de pytest para fallar rápido (lint es segundos).
      - name: Ruff check
        run: uv run --no-sync ruff check app tests scripts

      - name: Alembic upgrade head (Postgres service)
        # Migraciones contra el service Postgres 16 (DB vacía). Debe correr antes de INT.1.
        run: uv run --no-sync alembic upgrade head

      - name: Verify single Alembic head
        # Sin head hardcodeado: valida 1 head único + cadena lineal (no se
        # rompe al añadir migraciones nuevas).
        run: uv run --no-sync python scripts/check_migrations.py

      # Idempotencia: re-aplicar en una BD ya migrada debe ser no-op.
      - name: Alembic upgrade idempotent
        run: uv run --no-sync alembic upgrade head

      # COV.GATE.1 — gate solo sobre módulos críticos (económico + auth), no
      # sobre el monorepo entero. Actual: ~97 %; el 70 % es piso de disciplina.
      - name: Unit tests + coverage gate (critical modules)
        run: |
          uv run --no-sync python -m pytest tests/unit -q --tb=line \
            --cov=app.services.profit_analyzer \
            --cov=app.services.opportunity_finder \
            --cov=app.services.auth_service \
            --cov=app.dependencies.auth \
            --cov-report=term-missing \
            --cov-fail-under=70

      # INT.1 — mismo subconjunto que release_check --with-integration.
      # Obligatorio (CI.2): falla el job si integration crítico falla.
      - name: Integration critical subset (INT.1)
        run: |
          uv run --no-sync python -m pytest -q \
            tests/integration/test_admin_status_api.py \
            tests/integration/test_api_keys_api.py \
            tests/integration/test_admin_api_keys_api.py \
            tests/integration/test_auth_api.py \
            tests/integration/test_vehicles_api.py \
            --tb=line

  # CI.FE.1 — corre en paralelo al backend (sin `needs:`) para no alargar el
  # wall-clock. No necesita Postgres ni Redis.
  frontend:
    name: frontend (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # CI.LINT.1 (frontend) — verificado en limpio: pasa con warnings, sin errors.
      - name: Lint
        run: npm run lint

      # COV.GATE.1 — thresholds en vitest.config.ts sobre store/** y services/**.
      - name: Unit tests + coverage (Vitest)
        run: npm run test:coverage
        env:
          # La auth debe seguir ON en CI: con el flag de uso personal los tests
          # de AuthGuard/store dejarían de validar el camino multiusuario.
          NEXT_PUBLIC_AUTH_DISABLED: "false"
          CI: "true"

      # Build de servidor (igual que la imagen Docker) para detectar errores
      # de compilación/type-check que Vitest no cubre.
      - name: Build Next.js (server)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # CI.DOCKER.1 — construye las imágenes y levanta el stack real (compose):
  #   docker build → containers → migrations → backend → frontend → health.
  # Valida también scripts/validate_deployment.sh (el mismo que usa Deploy).
  docker:
    name: docker build + stack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      # Fixtures de CI — nunca secrets reales. JWT ≥32 chars (fail-fast app).
      JWT_SECRET_KEY: ci_stack_smoke_secret_key_at_least_32_chars_long_not_for_prod
      ENVIRONMENT: development
      AUTH_DISABLED: "true"
      ALLOW_AUTH_DISABLED_IN_PROD: "false"
      ENABLE_SCHEDULER: "false"
      NEXT_PUBLIC_API_URL: http://localhost:8001
      NEXT_PUBLIC_AUTH_DISABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compose config válida
        run: docker compose config --quiet && echo "compose config OK"

      - name: Build imágenes (api + frontend)
        run: docker compose build --pull api frontend

      - name: Levantar db + redis
        run: docker compose up -d --wait db redis

      - name: Levantar api (aplica migraciones al arrancar)
        run: docker compose up -d --wait api

      - name: Health checks backend (/health/live + /health compuesto)
        run: |
          curl -fsS http://127.0.0.1:8001/health/live | tee /dev/stderr | grep -q '"ok"'
          curl -fsS http://127.0.0.1:8001/health | tee /dev/stderr | grep -q '"database": *"ok"\|"database":"ok"'
          echo "Backend OK"

      - name: Migraciones aplicadas (alembic current = head)
        run: |
          CURRENT=$(docker compose exec -T api alembic current 2>/dev/null | tr -d '[:space:]')
          echo "Revisión actual: ${CURRENT}"
          test -n "$CURRENT" || { echo "::error::alembic current vacío (sin migrar)"; exit 1; }
          docker compose exec -T api alembic upgrade head  # idempotente

      - name: Levantar frontend
        run: docker compose up -d --wait frontend

      - name: Validación completa del stack (validate_deployment.sh)
        run: ./scripts/validate_deployment.sh http://127.0.0.1

      # E2E.WEB.1 — el proyecto tenía @playwright/test instalado y specs
      # reales en frontend/e2e/*.spec.ts, pero ningún script npm ni workflow
      # de CI los ejecutaba jamás (test:e2e apunta a Maestro, un runner
      # distinto, sobre el mismo directorio). Corriéndolos por primera vez
      # contra la app real se encontraron 2 specs rotos de verdad (locator
      # ambiguo en complete-user-journey.spec.ts, selectores inexistentes en
      # admin-panel.spec.ts) — ya corregidos. Se ejecutan aquí, contra el
      # stack real que este job ya levantó, en vez de contra un servidor de
      # desarrollo aparte.
      - name: Setup Node (para Playwright E2E)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E web (Playwright) contra el stack real
        working-directory: frontend
        run: npm run test:e2e:web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001

      - name: Diagnóstico en fallo (logs del stack)
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=100 api frontend db redis

      - name: Teardown
        if: always()
        run: docker compose down -v --remove-orphans
