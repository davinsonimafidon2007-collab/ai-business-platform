# Deploy — despliegue a un único VPS de uso personal (Bloque 6 / DEVOPS).
#
# - Tag semántico `v*` (p.ej. v1.2.0) -> production (único entorno).
#
# SIMPLIFICADO respecto a la versión anterior (que desplegaba a staging y
# luego a producción, dos servidores separados): este proyecto es de uso
# personal en un único VPS pequeño — mantener un segundo servidor de
# staging solo duplicaría el coste sin aportar nada para un usuario único.
# Si en el futuro hace falta un entorno de staging real, se puede añadir
# un job análogo con su propio `environment: staging` y sus propios
# secrets STAGING_*, sin tocar este.
#
# Requiere secrets del repositorio (o del environment "production"):
#   PRODUCTION_HOST, PRODUCTION_USER, PRODUCTION_KEY (SSH private key)
#
# Requiere variables del environment "production" (o del repo):
#   DOMAIN, ACME_EMAIL — usados por docker-compose.caddy.yml / Caddyfile
#   para servir HTTPS automático (ver docs/deployment.md, sección
#   "Despliegue personal").
#
# Cada job valida ANTES de conectar que los secrets existen: sin ellos el
# job falla con mensaje claro en segundos (no tras un timeout de SSH).
#
# En el servidor: git, docker + compose plugin, repo clonado en
# /opt/ai-business-platform y un .env.personal propio (ver
# .env.personal.example y docs/deployment.md).
#
# Tras el despliegue corre scripts/validate_deployment.sh (mismo smoke que
# el job "docker" de CI): api /health/live + /health + /metrics, frontend,
# pg_isready y redis-cli ping.

name: Deploy

on:
  push:
    tags:
      - "v*"

jobs:
  production:
    name: Deploy to production (VPS personal)
    runs-on: ubuntu-latest
    environment: production
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar secrets presentes
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_KEY: ${{ secrets.PRODUCTION_KEY }}
        run: |
          missing=0
          for var in PRODUCTION_HOST PRODUCTION_USER PRODUCTION_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::Falta el secret ${var} (environment: production)"
              missing=1
            fi
          done
          exit $missing

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_KEY }}
          script: |
            set -e
            cd /opt/ai-business-platform
            git fetch --all --tags
            git checkout ${{ github.ref_name }}
            # Stack personal completo: hardening de producción (sin
            # bind-mount, sin puertos de BD/Redis publicados) + Caddy
            # como único punto de entrada público con HTTPS automático.
            # DOMAIN/ACME_EMAIL vienen del .env.personal del servidor.
            docker compose \
              -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.caddy.yml \
              --env-file .env.personal \
              up -d --build
            docker compose \
              -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.caddy.yml \
              --env-file .env.personal \
              ps
            # Validación post-despliegue contra el dominio real (no localhost),
            # para confirmar que Caddy sirve HTTPS correctamente. Puertos
            # vacíos: en modo dominio no se añade ":8001"/":3001" a la URL
            # (Caddy sirve por subdominio en 443, ver scripts/validate_deployment.sh).
            API_PORT= FRONTEND_PORT= ./scripts/validate_deployment.sh \
              "https://api.${{ vars.DOMAIN }}" "https://${{ vars.DOMAIN }}"
