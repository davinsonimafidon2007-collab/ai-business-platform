# monitoring/prometheus.yml — Configuración de Prometheus para el perfil obs
# (docker compose --profile obs). Bloque 6 / DEVOPS.
#
# Targets (red interna de docker-compose, no localhost):
#   - api:8000            → FastAPI /metrics (métricas de negocio, sin auth)
#   - node_exporter:9100  → métricas de sistema/host
#   - postgres_exporter:9187 → métricas de PostgreSQL (via DATA_SOURCE_NAME)
#
# Este archivo se monta en el contenedor prometheus vía docker-compose.yml
# (servicio prometheus, perfil obs).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "fastapi"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: "/metrics"
    scheme: "http"

  - job_name: "node_exporter"
    static_configs:
      - targets: ["node_exporter:9100"]
    scheme: "http"

  - job_name: "postgres_exporter"
    static_configs:
      - targets: ["postgres_exporter:9187"]
    scheme: "http"
