services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: >
      sh -c "for i in 1 2 3 4 5; do uv run --no-sync alembic upgrade head && break || echo 'Waiting for DB...' && sleep 3; done && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${API_PORT:-8001}:8000"
    volumes:
      - .:/app
      - uploads_data:/app/uploads/inspection_photos
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/ai_business_platform
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      APP_URL: "${APP_URL:-http://localhost:3001}"
      ENABLE_SCHEDULER: "${ENABLE_SCHEDULER:-true}"
      ENABLE_MOBILE_DE: "${ENABLE_MOBILE_DE:-false}"
      PROVIDER_HTTP_PROXY: "${PROVIDER_HTTP_PROXY:-}"
      FIREBASE_CREDENTIALS_JSON: "${FIREBASE_CREDENTIALS_JSON}"
      # Uso personal (PERS.CLOSE.1): sin este passthrough el contenedor arranca
      # con AUTH_DISABLED vacío (=false) y la API responde 401 aunque el .env
      # del host diga true.
      AUTH_DISABLED: "${AUTH_DISABLED:-false}"
      ALLOW_AUTH_DISABLED_IN_PROD: "${ALLOW_AUTH_DISABLED_IN_PROD:-false}"
      APP_MODE: "${APP_MODE:-personal}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    environment:
      # GRAVE.004: el frontend se sirve desde el HOST (puerto 3001), así que
      # el navegador no puede resolver 'api'; apuntamos a localhost:8001.
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8001}"
      NEXT_PUBLIC_AUTH_DISABLED: "${NEXT_PUBLIC_AUTH_DISABLED:-false}"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Bloque 6: healthcheck del frontend (GET / en el puerto interno 3000).
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_business_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_business_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: unless-stopped
    profiles:
      - monitoring
      - obs

  grafana:
    image: grafana/grafana:latest
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    profiles:
      - monitoring
      - obs

  node-exporter:
    image: prom/node-exporter:latest
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    restart: unless-stopped
    profiles:
      - monitoring
      - obs

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ai_business_platform}?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      - db
    restart: unless-stopped
    profiles:
      - monitoring
      - obs

  backup:
    image: postgres:16-alpine
    volumes:
      - ./scripts:/scripts:ro
      - backup_data:/backups
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_business_platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ai_business_platform}
      DOCKER_CONTAINER: ai-business-platform-db-1
      BACKUP_DIR: /backups
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    entrypoint: |
      sh -c "
        echo '0 2 * * * /scripts/backup-postgres.sh >> /var/log/backup.log 2>&1' > /etc/crontabs/root &&
        crond -f -l 8
      "
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - backup

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  prometheus_data:
    name: abp_prometheus_data
  grafana_data:
    name: abp_grafana_data
  backup_data:

