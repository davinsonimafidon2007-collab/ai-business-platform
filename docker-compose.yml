# =============================================================================
# docker-compose.yml — stack BASE (seguro por defecto, válido para servidor).
#
# Sin overlays, la BD/Redis quedan en loopback (127.0.0.1) y sin bind-mount
# del código: `docker compose up` por sí solo no expone nada al exterior.
#
# En desarrollo local se usa junto al overlay dev (bind-mount + hot-reload):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# (o COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml en .env)
#
# En producción, docker-compose.prod.yml (TASK 8 / AUD-025) endurece más:
# credenciales obligatorias (sin defaults) y cierra los puertos de datos por
# completo (ni siquiera en loopback):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Observabilidad opcional:  docker compose --profile obs up -d
# Logging centralizado:     docker compose -f docker-compose.logging.yml --profile logging up -d
# =============================================================================
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    # Migraciones ANTES de arrancar uvicorn. Si tras N reintentos la BD no
    # acepta migraciones, el contenedor MUERE (exit 1): nunca servir tráfico
    # sobre un esquema sin migrar.
    entrypoint:
      - /bin/sh
      - -c
      - |
        i=0; until alembic upgrade head; do
          i=$$((i+1))
          if [ "$$i" -ge 10 ]; then echo "ERROR: migraciones no aplicadas tras $$i reintentos"; exit 1; fi
          echo "Esperando DB para migrar... (intento $$i)"; sleep 3
        done
        exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_HOST:-127.0.0.1}:${API_PORT:-8001}:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ai_business_platform}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?JWT_SECRET_KEY es obligatorio (.env)}"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      APP_URL: "${APP_URL:-http://localhost:3001}"
      ENABLE_SCHEDULER: "${ENABLE_SCHEDULER:-true}"
      ENABLE_MOBILE_DE: "${ENABLE_MOBILE_DE:-false}"
      PROVIDER_HTTP_PROXY: "${PROVIDER_HTTP_PROXY:-}"
      FIREBASE_CREDENTIALS_JSON: "${FIREBASE_CREDENTIALS_JSON:-}"
      # Bug real encontrado probando el stack en vivo: sin este passthrough
      # el contenedor ignora el CORS_ORIGINS del .env del host y usa el
      # default de app/core/config.py (puertos 3000/5173/8080), que NO
      # incluye el puerto 3001 donde este mismo compose sirve el frontend
      # (FRONTEND_PORT) — el navegador bloquea todas las llamadas a la API
      # por CORS aunque los healthchecks pasen y los contenedores estén sanos.
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}"
      # Uso personal (PERS.CLOSE.1): sin este passthrough el contenedor arranca
      # con AUTH_DISABLED vacío (=false) y la API responde 401 aunque el .env
      # del host diga true.
      AUTH_DISABLED: "${AUTH_DISABLED:-false}"
      ALLOW_AUTH_DISABLED_IN_PROD: "${ALLOW_AUTH_DISABLED_IN_PROD:-false}"
      APP_MODE: "${APP_MODE:-personal}"
    volumes:
      - uploads_data:/app/uploads/inspection_photos
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # El scheduler puede tener jobs en vuelo al recibir SIGTERM: darle tiempo.
    stop_grace_period: 30s
    healthcheck:
      # TASK-004: liveness puro (proceso vivo) para que Docker no reinicie la
      # API mientras las dependencias (DB/Redis) aún arrancan.
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* se inlinean en el bundle en BUILD time.
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8001}"
        NEXT_PUBLIC_AUTH_DISABLED: "${NEXT_PUBLIC_AUTH_DISABLED:-false}"
        NEXT_PUBLIC_APP_VERSION: "${NEXT_PUBLIC_APP_VERSION:-}"
    ports:
      - "${FRONTEND_HOST:-127.0.0.1}:${FRONTEND_PORT:-3001}:3000"
    environment:
      # GRAVE.004: el frontend se sirve desde el HOST (puerto 3001), así que
      # el navegador no puede resolver 'api'; apuntamos a localhost:8001.
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8001}"
      NEXT_PUBLIC_AUTH_DISABLED: "${NEXT_PUBLIC_AUTH_DISABLED:-false}"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Bloque 6: healthcheck del frontend (GET / en el puerto interno 3000).
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000', (r) => {process.exit(r.statusCode < 500 ? 0 : 1)}).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-ai_business_platform}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      # Default solo para desarrollo local; en producción es obligatorio
      # definirlo (ver docker-compose.prod.yml).
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    ports:
      # Bind a loopback por defecto: en un servidor con IP pública la BD no
      # queda expuesta; override con DB_HOST=0.0.0.0 si se necesita externo.
      - "${DB_HOST:-127.0.0.1}:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_business_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST:-127.0.0.1}:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    # Bloque 6 / DEVOPS: observabilidad opcional. Solo se arranca con
    #   docker compose --profile obs up -d
    image: prom/prometheus:v2.53.0
    profiles: ["obs"]
    container_name: abp_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "${PROMETHEUS_HOST:-127.0.0.1}:9090:9090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    # Bloque 6 / DEVOPS: dashboard provisionado (monitoring/grafana/).
    # Acceso: http://localhost:3002  (admin / $GRAFANA_ADMIN_PASSWORD)
    image: grafana/grafana:11.1.0
    profiles: ["obs"]
    container_name: abp_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # AUD-026: el default ya no es "admin". Este valor es explícitamente
      # de desarrollo; en producción docker-compose.prod.yml lo hace
      # obligatorio (compose falla si no está definido).
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-devonly-change-me}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_HOST:-127.0.0.1}:3002:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  node_exporter:
    # Bloque 6 / DEVOPS: métricas de sistema (perfil obs).
    image: prom/node-exporter:v1.8.2
    profiles: ["obs"]
    container_name: abp_node_exporter
    command:
      - --path.rootfs=/host
    ports:
      - "${NODE_EXPORTER_HOST:-127.0.0.1}:9100:9100"
    restart: unless-stopped

  postgres_exporter:
    # Bloque 6 / DEVOPS: métricas de PostgreSQL (perfil obs). Habla con la
    # BD en la red interna docker (db:5432), no host.
    image: prometheuscommunity/postgres-exporter:v0.15.0
    profiles: ["obs"]
    container_name: abp_postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-ai_business_platform}?sslmode=disable"
    ports:
      - "${POSTGRES_EXPORTER_HOST:-127.0.0.1}:9187:9187"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  prometheus_data:
    name: abp_prometheus_data
  grafana_data:
    name: abp_grafana_data
