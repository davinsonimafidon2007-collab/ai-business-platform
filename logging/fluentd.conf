# logging/fluentd.conf — Configuración de Fluentd (perfil logging, Bloque 6).
# Recoge logs forward desde los contenedores (fluentd driver) y los indexa
# en Elasticsearch con formato logstash (índice por día: ai_business-YYYY.MM.DD).

<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<match **>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix ai_business
  <buffer>
    @type file
    path /fluentd/buffer
    flush_interval 5s
  </buffer>
</match>
