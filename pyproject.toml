[project]
name = "ai-business-platform"
version = "0.1.0"
description = "AI business platform"
readme = "README.md"
authors = [
    { name = "Davinson" },
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "alembic>=1.14.0,<2.0.0",
    "email-validator>=2.0.0,<3.0.0",
    "aiosqlite>=0.10.0,<1.0.0",
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "pwdlib[argon2]>=0.2.0,<1.0.0",
    "slowapi>=0.1.9,<1.0.0",
    "limits>=3.0.0,<4.0.0",
    "tenacity>=9.0.0,<10.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "httpx>=0.27.0,<1.0.0",
    "lxml>=5.0.0,<6.0.0",
    "python-multipart>=0.0.20,<1.0.0",
    "firebase-admin>=6.0.0,<7.0.0",
    "aiosmtplib>=3.0.0,<4.0.0",
    "redis>=5.0.0,<6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "ruff>=0.6.0,<1.0.0",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "*/tests/*",
    "app/scripts/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# COV.GATE.1: el gate NO es global. Se aplica por paths críticos desde el
# comando de CI (--cov=<modulo> --cov-fail-under=70), para no exigir un 80 %
# de todo el monorepo ni premiar cobertura de módulos triviales.
fail_under = 0

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# CODE-001: reglas base de higiene. B008 (FastAPI `Depends()` en defaults) y
# E501 (line length) se ignoran repo-wide: B008 es el idioma idiomático de
# FastAPI y E501 está acotado por Ruff formatter. El baseline heredado de UP/F/I
# se gestiona de forma incremental (ver TODO CODE-001).
select = ["E", "F", "I", "UP", "B"]
# UP042 (CI.LINT.1): migrar los 14 enums de dominio de `(str, Enum)` a
# `StrEnum` cambia el resultado de `str(x)` y `f"{x}"` (pasa de
# "Role.ADMIN" a "admin"), lo que afecta a payloads de API, logs y
# comparaciones ya asentadas. No es higiene: es un cambio de comportamiento
# que merece su propio task con revisión de contratos.
ignore = ["E501", "B008", "UP042"]

# CI.LINT.1 — excepciones acotadas y justificadas. No se relaja `select`.
[tool.ruff.lint.per-file-ignores]
# E712: en SQLAlchemy `Column == True` NO puede sustituirse por `if col:`.
# El operador `==` construye la expresión SQL; el truthiness de Python
# evaluaría el objeto Column, que siempre es verdadero, y generaría un WHERE
# incorrecto. Es un falso positivo de la regla sobre código ORM.
"app/repositories/*.py" = ["E712"]
# E402: estos scripts hacen `sys.path.insert(...)` antes de importar `app`
# para ser ejecutables directamente (`python scripts/x.py`), así que los
# imports no pueden ir arriba del todo.
"app/scripts/verify_providers_live.py" = ["E402"]
"scripts/*.py" = ["E402"]
# F841: asignaciones no usadas en tests que documentan el setup o donde el
# valor se inspecciona en el fallo. Residual heredado, ver TODO CODE-001.
"tests/integration/test_auth_api.py" = ["F841"]
"tests/integration/test_search_engine.py" = ["F841"]
"tests/unit/test_deals_api.py" = ["F841"]
"tests/unit/test_profit_analyzer.py" = ["F841"]
"tests/unit/test_request_id_middleware.py" = ["F841"]
